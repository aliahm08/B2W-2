<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Operations preview | B2W</title><style>
:root{font-family:Inter,Arial,sans-serif;font-size:16px;color:#171714;background:#f2f1ed;--line:#d1cec8;--orange:#e46434;--green:#39745f;--muted:#66625e}*{box-sizing:border-box}body{margin:0}body,button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}a{color:inherit}h1,h2,h3,p{margin:0;font-size:16px;line-height:1.55}h1,h2,h3{font-weight:750}small,.small{font-size:13px;color:var(--muted)}.shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}.rail{border-right:1px solid var(--line);padding:29px 22px;display:flex;flex-direction:column;gap:42px;background:#edeae4}.brand{font-weight:800;letter-spacing:-.03em;text-decoration:none}.brand span{color:var(--orange)}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;text-align:left;padding:12px;border-radius:8px;color:#55514d}.nav button.active{border-color:var(--line);background:#fff;color:#171714;font-weight:750}.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}.main{padding:30px clamp(20px,4vw,70px) 70px;max-width:1650px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:25px;border-bottom:1px solid var(--line)}.top-actions{display:flex;align-items:center;gap:12px}.chip{border:1px solid var(--line);padding:8px 12px;border-radius:20px;background:#faf9f6;font-size:13px}.primary{background:#171714;color:#fff;border:1px solid #171714;padding:10px 16px;border-radius:8px}.secondary{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin:43px 0 27px}.intro p{color:var(--muted);max-width:520px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.stat{grid-column:span 2;background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px;min-height:140px}.stat .value{font-size:28px;font-weight:750;letter-spacing:-.04em;margin:15px 0 3px}.stat .value.positive{color:var(--green)}.stat .value.risk{color:#b94235}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}.panel.wide{grid-column:span 4}.panel.side{grid-column:span 2}.panel.full{grid-column:span 6}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:19px}.panel-head h2{font-weight:750}.link{border:0;background:none;text-decoration:underline;text-underline-offset:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid #e9e7e2;text-align:left}.row:first-of-type{border-top:none}.grow{flex:1;min-width:0}.grow p{margin-top:4px;color:var(--muted)}.amount{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}.badge{font-size:12px;border-radius:999px;padding:4px 9px;background:#eff0eb;white-space:nowrap}.badge.warn{background:#faede1;color:#9c4a19}.badge.ok{background:#e8f1eb;color:#23533f}.mini{background:#f7f6f2;border-left:2px solid var(--orange);padding:12px;margin-top:11px;color:#55514d}.action-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.section-label{margin:27px 0 15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:630px;text-align:left}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}.table td,.table th{padding:14px 11px;border-top:1px solid #e9e7e2}.table td:first-child,.table th:first-child{padding-left:0}.table td:last-child,.table th:last-child{padding-right:0;text-align:right}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#faf9f6}.bar{height:8px;border-radius:20px;background:#ebe7df;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--green)}.project{grid-column:span 3;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px}.project button{border:0;background:none;text-align:left;width:100%;padding:0}.project .meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.project .detail{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.hide{display:none}.notice{background:#fff7ec;border:1px solid #ecd2b3;padding:13px 16px;border-radius:8px;margin-top:18px}.mobile-nav{display:none}.superset{background:#f7f6f2;border:1px dashed #b8b2a8;padding:20px;border-radius:8px;margin-top:14px}.check{accent-color:var(--green)}.muted{color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:165px 1fr}.rail{padding:20px 12px}.panel.wide,.panel.side{grid-column:span 6}.project{grid-column:span 6}}@media(max-width:700px){.shell{display:block}.rail{display:none}.mobile-nav{display:flex;position:sticky;top:0;background:#f2f1ed;z-index:10;overflow:auto;border-bottom:1px solid var(--line);padding:10px 14px;gap:8px}.mobile-nav button{white-space:nowrap;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:white}.mobile-nav button.active{background:#171714;color:#fff}.main{padding:20px 16px 50px}.top{align-items:start}.top-actions .chip{display:none}.intro{margin:28px 0 20px}.stat{grid-column:span 3;padding:14px;min-height:123px}.stat .value{font-size:22px}.panel{padding:17px}.top-actions{gap:6px}.project{grid-column:span 6}}
@media(prefers-reduced-motion:no-preference){.panel,.stat,.project{animation:appear .25s ease both}@keyframes appear{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><div class="mobile-nav" id="mobile-nav"></div><div class="shell"><aside class="rail"><a href="/" class="brand">B2W<span>.</span> <span style="color:#39745f">/ JasonAI</span></a><div><p class="eyebrow" style="margin-bottom:13px">Workspace</p><nav class="nav" id="rail-nav"></nav></div><div class="foot"><p class="eyebrow">Design preview v1</p><p class="small" style="margin-top:8px">Illustrative contractor data.<br>No real payments or messages.</p><a class="small" href="/" style="display:block;margin-top:15px">← B2W website</a></div></aside><main class="main"><header class="top"><div><p class="eyebrow">B2W / JasonAI</p><h1>Operations</h1></div><div class="top-actions"><span class="chip">Oak & Co. Contracting</span><button class="secondary" id="reset">Reset demo</button></div></header><section class="intro"><div><p class="eyebrow" id="section-eyebrow">Monday / October 12</p><h2 id="page-title">Today</h2><p id="subtitle">The commitments, payments and updates that need your attention.</p></div><span class="chip">● Illustrative workspace</span></section><div id="content"></div></main></div>
<script>
const names=['Today','Projects','Labor','Activity','Analytics'];let current='Today',expanded='',reviewed=new Set(),paid=new Set();const jobs=[{id:'oak',name:'Oak Street Renovation',status:'In progress',owed:4200,due:1750,detail:'Framing completed. Crew hours need review.',workers:'Marco, Luis, Jamal',progress:70},{id:'pine',name:'Pinecrest Addition',status:'Awaiting materials',owed:1800,due:950,detail:'Cabinetry shipment delayed until Wednesday.',workers:'Omar, Leo',progress:40},{id:'cedar',name:'Cedar Lane Kitchen',status:'In progress',owed:3100,due:1350,detail:'Electrical rough-in scheduled for Tuesday.',workers:'Noah, Luis',progress:55},{id:'maple',name:'Maple Avenue Repair',status:'Closeout',owed:900,due:450,detail:'Final walkthrough pending customer confirmation.',workers:'Marco',progress:95}];const labor=[['Marco','Framing',450,'Oak Street, Maple Ave'],['Luis','Carpentry',400,'Oak Street, Cedar Lane'],['Jamal','Labor',350,'Oak Street'],['Omar','Installation',475,'Pinecrest'],['Noah','Electrical',425,'Cedar Lane']];const events=[{id:'e1',title:'Confirm crew overtime',job:'Oak Street Renovation',source:'Selected WhatsApp update · Today, 9:12 AM',detail:'“Marco and two workers stayed until 6. Please add their extra time.”',state:'Needs review'},{id:'e2',title:'Update cabinetry delivery',job:'Pinecrest Addition',source:'Selected WhatsApp update · Today, 8:40 AM',detail:'“Supplier called. Cabinetry now arriving Wednesday.”',state:'Needs review'},{id:'e3',title:'Mark framing complete',job:'Oak Street Renovation',source:'Selected WhatsApp update · Yesterday, 4:25 PM',detail:'“Framing is done. Ready for next inspection.”',state:'Needs review'}];const money=n=>'$'+n.toLocaleString('en-US');const nav=()=>{for(const id of ['rail-nav','mobile-nav'])document.getElementById(id).innerHTML=names.map(n=>'<button class="'+(n===current?'active':'')+'" data-page="'+n+'" type="button">'+n+'</button>').join('')};function stat(label,value,sub,cls=''){return '<article class="stat"><p class="eyebrow">'+label+'</p><div class="value '+cls+'">'+value+'</div><p class="small">'+sub+'</p></article>'}function panel(title,body,kind='full',action=''){return '<section class="panel '+kind+'"><div class="panel-head"><h2>'+title+'</h2>'+action+'</div>'+body+'</section>'}function item(title,sub,right,detail='',key=''){return '<div class="row"><div class="grow"><h3>'+title+'</h3><p class="small">'+sub+'</p>'+(expanded===key?'<div class="mini">'+detail+'</div>':'')+'</div>'+right+(key?'<button class="secondary" data-expand="'+key+'">'+(expanded===key?'Close':'Details')+'</button>':'')+'</div>'}const totalDue=jobs.reduce((s,j)=>s+(paid.has(j.id)?0:j.due),0);function today(){return '<div class="grid">'+stat('Payroll due Friday',money(jobs.reduce((s,j)=>s+(paid.has(j.id)?0:j.due),0)),'Across four projects','risk')+stat('Needs approval',String(events.filter(e=>!reviewed.has(e.id)).length),'Proposed changes to review')+stat('Open projects','4','1 approaching closeout')+panel('Priority actions',events.filter(e=>!reviewed.has(e.id)).map(e=>item(e.title,e.job,'<span class="badge warn">Review</span>',e.detail+'<div class="action-row"><button class="primary" data-approve="'+e.id+'">Approve proposed update</button></div>',e.id)).join('')||'<p class="muted">All proposed actions have been reviewed.</p>','wide','<button class="link" data-page="Activity">Activity →</button>')+panel('Weekly payroll',jobs.map(j=>item(j.name,'Due Friday', '<span class="amount">'+money(paid.has(j.id)?0:j.due)+'</span>')).join(''),'side','<button class="link" data-page="Labor">Labor →</button>')+'</div>'}function projects(){return '<div class="grid">'+jobs.map(j=>'<article class="project"><div class="meta"><span class="eyebrow">'+j.status+'</span><span class="badge '+(j.status==='Awaiting materials'?'warn':'ok')+'">'+j.progress+'% complete</span></div><button data-expand="'+j.id+'"><h3>'+j.name+' ↗</h3><p class="small">Customer balance: '+money(j.owed)+' · Labor due: '+money(j.due)+'</p></button><div class="bar"><span style="width:'+j.progress+'%"></span></div>'+(expanded===j.id?'<div class="detail"><p>'+j.detail+'</p><p class="small" style="margin-top:9px">Assigned: '+j.workers+'</p><div class="action-row"><button class="secondary" data-expand="'+j.id+'">Collapse</button></div></div>':'')+'</article>').join('')+'</div>'}function laborPage(){let rows=labor.map(([name,trade,rate,projects],i)=>'<tr data-expand="worker'+i+'"><td><strong>'+name+'</strong>'+(expanded==='worker'+i?'<div class="mini">Assigned to '+projects+'. Illustration only; validate hours against original messages.</div>':'')+'</td><td>'+trade+'</td><td>'+money(rate)+'</td><td>'+projects+'</td><td>'+money(rate)+'</td></tr>').join('');return '<div class="grid">'+stat('Estimated daily crew cost',money(labor.reduce((s,l)=>s+l[2],0)),'Illustrative day rates')+stat('Outstanding job payroll',money(jobs.reduce((s,j)=>s+(paid.has(j.id)?0:j.due),0)),'Friday cutoff','risk')+stat('Payments recorded',money(jobs.reduce((s,j)=>s+(paid.has(j.id)?j.due:0),0)),'Demo-state only','positive')+panel('Workers · illustrative daily rates','<div class="table-wrap"><table class="table"><thead><tr><th>Worker</th><th>Trade</th><th>Daily rate</th><th>Assigned projects</th><th>Today</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+panel('Friday payment checklist',jobs.map(j=>item(j.name,j.workers,'<span class="amount">'+money(j.due)+'</span>',paid.has(j.id)?'Recorded as paid in this local demo.':'<div class="action-row"><button class="primary" data-pay="'+j.id+'">Mark as paid (demo)</button></div>',j.id)).join(''))+'</div>'}function activity(){return '<div class="grid">'+panel('Proposed changes',events.map(e=>item(e.title,e.source+' · '+e.job,'<span class="badge '+(reviewed.has(e.id)?'ok':'warn')+'">'+(reviewed.has(e.id)?'Approved':'Needs review')+'</span>',e.detail+'<div class="action-row">'+(!reviewed.has(e.id)?'<button class="primary" data-approve="'+e.id+'">Approve</button><button class="secondary" data-reject="'+e.id+'">Reject</button>':'<span class="badge ok">Reviewed in demo</span>')+'</div>',e.id)).join(''))+'</div>'}function analytics(){return '<div class="grid">'+stat('Committed labor',money(jobs.reduce((s,j)=>s+j.due,0)),'Current illustrative snapshot')+stat('Customer balances',money(jobs.reduce((s,j)=>s+j.owed,0)),'Across four projects')+stat('Active jobs','4','One pending closeout')+panel('Payroll by project',jobs.map(j=>'<div class="row"><div class="grow"><h3>'+j.name+'</h3><div class="bar"><span style="width:'+(j.due/1750*100)+'%"></span></div></div><strong>'+money(j.due)+'</strong></div>').join(''),'wide')+panel('Apache Superset compatibility','<p>Superset can power read-only analytics and embedded charts here. Payroll editing, message provenance, approvals and project actions remain custom React/JS application workflows.</p><div class="superset"><p class="eyebrow">Integration placeholder</p><p class="small">Replace this region with an embedded Superset dashboard after configuring a Superset instance, allowed origins, row-level security and server-issued guest tokens.</p></div>','side')+'</div>'}const subtitles={Today:'The commitments, payments and updates that need your attention.',Projects:'Follow job progress, balances, workers and changes in one place.',Labor:'Review your crew and reconcile payroll before Friday.',Activity:'Review proposed updates against their original source messages.',Analytics:'An operational reporting surface designed to accommodate Apache Superset.'};function render(){nav();document.getElementById('page-title').textContent=current;document.getElementById('subtitle').textContent=subtitles[current];document.getElementById('section-eyebrow').textContent='JasonAI / '+current;document.getElementById('content').innerHTML=({Today:today,Projects:projects,Labor:laborPage,Activity:activity,Analytics:analytics})[current]();}document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-expand],[data-approve],[data-reject],[data-pay],#reset');if(!t)return;if(t.id==='reset'){reviewed.clear();paid.clear();expanded='';current='Today'}else if(t.dataset.page){current=t.dataset.page;expanded=''}else if(t.dataset.expand){expanded=expanded===t.dataset.expand?'':t.dataset.expand}else if(t.dataset.approve){reviewed.add(t.dataset.approve);expanded=''}else if(t.dataset.reject){reviewed.add(t.dataset.reject);expanded=''}else if(t.dataset.pay){paid.add(t.dataset.pay);expanded=''}render()});render();
</script></body></html>
