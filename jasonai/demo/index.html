<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171b1d">
  <meta name="description" content="JasonAI interactive contractor operations demo">
  <title>JasonAI — Operations demo</title>
  <style>
    :root{--bg:#14191b;--surface:#1c2225;--surface2:#252d30;--border:#394246;--text:#f2f1ea;--muted:#a5afb1;--amber:#f5ad42;--steel:#8aa0a9;--green:#93c7a4;--radius:18px;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:3px}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}.sidebar{border-right:1px solid var(--border);padding:27px 16px;display:flex;flex-direction:column;gap:35px;background:#171c1f}.brand{display:flex;align-items:center;gap:12px;padding:0 11px}.mark{width:42px;height:42px;flex:none}.brand-name{font-size:20px;font-weight:750;letter-spacing:-.05em}.brand small{display:block;color:var(--steel);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:11px;background:none;color:var(--muted);text-align:left;font-weight:600}.nav button:hover,.nav button.active{background:#2b3235;color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--amber)}.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}.side-bottom{margin-top:auto;padding:15px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5}.side-bottom strong{display:block;color:var(--text);font-size:13px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px}.main{min-width:0}.topbar{height:79px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(20px,3vw,48px)}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--text);font-weight:650}.top-actions{display:flex;align-items:center;gap:15px}.demo-pill{border:1px solid #695434;background:#362b1d;border-radius:99px;padding:6px 11px;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}.avatar{width:34px;height:34px;border-radius:50%;background:#49585e;display:grid;place-items:center;font-size:12px;font-weight:700}.content{max-width:1550px;margin:auto;padding:36px clamp(20px,3vw,48px) 80px}.eyebrow{font-size:11px;color:var(--amber);font-weight:750;letter-spacing:.16em;text-transform:uppercase}.heading-row{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 28px}.heading-row h1{font-size:clamp(30px,3.4vw,47px);letter-spacing:-.055em;line-height:1.08;margin:0}.heading-row p{color:var(--muted);font-size:14px;margin:10px 0 0}.date-chip{border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:18px}.stack{display:grid;gap:18px;align-content:start}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.card-pad{padding:23px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.card-head h2,.section-title{font-size:15px;letter-spacing:-.02em;margin:0}.card-head small{color:var(--muted);font-size:11px}.briefing{position:relative;background:linear-gradient(115deg,#303436,#252b2e 58%,#20272a);min-height:245px}.briefing:after{content:"";position:absolute;inset:0 0 0 46%;background:repeating-radial-gradient(ellipse at 100% 40%,transparent 0 14px,rgba(245,173,66,.11) 15px 16px,transparent 17px 26px);opacity:.75;pointer-events:none}.briefing>*{position:relative;z-index:1}.briefing .eyebrow{margin-bottom:18px}.briefing h2{font-size:clamp(24px,2.5vw,34px);letter-spacing:-.04em;line-height:1.18;max-width:590px;margin:0 0 12px}.briefing p{max-width:565px;line-height:1.58;color:#cbd0cf;font-size:14px;margin:0}.briefing-actions{display:flex;gap:10px;margin-top:22px}.primary,.secondary{border-radius:9px;padding:10px 14px;font-size:12px;font-weight:750}.primary{border:1px solid var(--amber);background:var(--amber);color:#211b12}.primary:hover{background:#ffc16a}.secondary{border:1px solid #697173;background:#30383b;color:var(--text)}.secondary:hover{background:#40494c}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{padding:20px 22px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin:10px 0 4px;font-size:27px;letter-spacing:-.05em}.metric small{font-size:11px;color:var(--green)}.metric.warn small{color:var(--amber)}.list{display:grid}.item{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-top:1px solid var(--border)}.item:first-child{border-top:0;padding-top:0}.item:last-child{padding-bottom:0}.item-icon{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:#344047;color:var(--steel);font-size:16px}.item-icon.amber{background:#443524;color:var(--amber)}.item-body{min-width:0;flex:1}.item-body strong{display:block;font-size:13px;line-height:1.35}.item-body p{color:var(--muted);font-size:12px;line-height:1.45;margin:5px 0 0}.tag{font-size:10px;font-weight:700;color:var(--amber);white-space:nowrap}.tag.green{color:var(--green)}.progress{height:5px;border-radius:5px;background:#3b4447;margin-top:13px;overflow:hidden}.progress i{display:block;height:100%;background:var(--amber);border-radius:5px}.link-button{border:0;background:none;color:var(--amber);padding:0;font-size:12px;font-weight:700}.link-button:hover{text-decoration:underline}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;padding:0 8px 12px}.table td{padding:14px 8px;border-top:1px solid var(--border);font-size:12px}.table td:first-child{font-weight:650}.table td:last-child,.table th:last-child{text-align:right}.status{display:inline-block;padding:5px 8px;border-radius:99px;background:#293c34;color:var(--green);font-size:10px;font-weight:700}.status.pending{background:#453624;color:var(--amber)}.bar-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.bar-row span{color:var(--muted)}.bar{height:8px;border-radius:8px;background:#354044;margin-bottom:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9aadb4,var(--amber));border-radius:8px}.filter-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:20px}.filter{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:99px;padding:8px 12px;font-size:11px;white-space:nowrap}.filter.active{background:var(--amber);border-color:var(--amber);color:#241c12;font-weight:800}.message{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:13px;padding:16px 0;border-top:1px solid var(--border)}.message:first-child{border-top:0}.message strong{font-size:13px}.message p{font-size:12px;color:var(--muted);margin:5px 0;line-height:1.45}.message small{font-size:10px;color:var(--steel)}.message time{font-size:10px;color:var(--muted)}.assistant-intro{padding:20px;border:1px solid #77582e;border-radius:14px;background:linear-gradient(135deg,#46331e,#292d2c)}.assistant-intro strong{font-size:15px}.assistant-intro p{font-size:12px;line-height:1.5;color:#ddd3c5}.chat-log{height:260px;overflow:auto;display:grid;align-content:start;gap:12px;padding:18px 0}.bubble{padding:11px 13px;border-radius:12px;background:#30393c;font-size:12px;line-height:1.5;max-width:92%}.bubble.user{background:#5b4529;justify-self:end}.chat-form{display:flex;gap:8px}.chat-form input{min-width:0;flex:1;border:1px solid var(--border);border-radius:10px;background:#161b1d;color:var(--text);padding:11px 12px;font-size:12px}.chat-form button{border:0;border-radius:10px;background:var(--amber);color:#211b12;font-weight:800;padding:0 14px}.prompt-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.prompt-row button{border:1px solid var(--border);border-radius:99px;background:none;color:var(--muted);font-size:10px;padding:7px 9px}.prompt-row button:hover{color:var(--text);border-color:var(--steel)}.empty{color:var(--muted);font-size:13px;padding:26px 0}.notice{position:fixed;bottom:20px;right:20px;z-index:20;background:#294237;color:#e4f4e8;border:1px solid #6f9d80;border-radius:10px;padding:12px 16px;font-size:12px;box-shadow:0 12px 40px #0007}.hidden{display:none!important}.footnote{color:var(--muted);font-size:11px;margin-top:20px}.mobile-nav{display:none}@media(max-width:1050px){.grid{grid-template-columns:1fr}.desktop-side{display:none}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.app{display:block}.sidebar{display:none}.topbar{height:62px;padding:0 18px}.topbar .crumb{font-size:12px}.top-actions{gap:8px}.avatar{display:none}.content{padding:26px 17px 105px}.heading-row{display:block;margin-bottom:22px}.date-chip{display:inline-block;margin-top:16px}.metrics{gap:8px}.metric{padding:15px}.metric strong{font-size:23px}.metric span{font-size:10px}.card-pad{padding:18px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:15;background:#1c2225;border-top:1px solid var(--border);padding:7px 4px max(7px,env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{display:grid;justify-items:center;gap:3px;width:20%;border:0;background:none;color:var(--muted);font-size:10px;padding:5px 0}.mobile-nav button.active{color:var(--amber)}.mobile-nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}.table th:nth-child(3),.table td:nth-child(3){display:none}.briefing{min-height:260px}}
    .briefing p,.item-body p,.message p,.assistant-intro p,.bubble,.chat-form input,.table td,.bar-row,.date-chip,.heading-row p{font-size:max(14px,1em)}
    .card-head small,.item-body strong,.message strong,.metric span,.link-button,.primary,.secondary,.filter,.status{font-size:13px}
    .brand small,.eyebrow,.demo-pill,.card-head small,.metric small,.tag,.table th,.status,.message small,.message time,.prompt-row button,.footnote{font-size:12px}
    .mobile-nav button{font-size:11px}
    @media(max-width:720px){.metric span{font-size:12px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><a class="brand" href="/jasonai" aria-label="JasonAI home"><svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 11c14 0 24-3 31-7M8 16c13 0 22-3 30-7M8 21c12 0 21-3 29-7M8 26c12 0 20-2 28-7M8 31c11 0 19-2 27-7M8 36c10 0 18-2 26-7M8 41c10 0 17-2 25-7" stroke="#f5ad42" stroke-width="1.5" stroke-linecap="round"/><path d="M32 3c-1 22-4 37-20 39" stroke="#aab8bc" stroke-width="2" stroke-linecap="round"/></svg><span><span class="brand-name">JasonAI</span><small>By B2W</small></span></a><nav class="nav" id="desktop-nav" aria-label="Dashboard"></nav><div class="side-bottom"><strong><span class="live-dot"></span>Demo workspace</strong>Sample data · No live connections</div></aside>
    <main class="main"><header class="topbar"><div class="crumb">JasonAI <span style="padding:0 8px;color:#596468">/</span> <b id="crumb">Today</b></div><div class="top-actions"><span class="demo-pill">Interactive demo</span><span class="avatar">JA</span></div></header><div class="content"><div class="eyebrow">Operations overview</div><div class="heading-row"><div><h1 id="page-title">Good morning, Jason.</h1><p id="page-subtitle">Here’s what needs your attention across the business.</p></div><span class="date-chip" id="date-chip"></span></div><div id="view"></div><p class="footnote">Illustrative contractor data. Approvals and assistant replies are simulated in this browser.</p></div></main>
  </div><nav class="mobile-nav" id="mobile-nav" aria-label="Dashboard mobile"></nav><div class="notice hidden" role="status" id="notice"></div>
  <script>
    const icons={Today:'<path d="M3 11.5 12 4l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',Labor:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v1"/>',Projects:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 5V3m8 2V3M3 11h18"/>',Activity:'<path d="M4 5h16v12H8l-4 4z"/><path d="M8 9h8M8 13h6"/>',Assistant:'<path d="m12 2 2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2zM19 19l1 1m-2-1 1-1"/>'};
    const state={view:'Today',filter:'All',approved:false,messages:[{from:'Maya Chen',channel:'SMS',category:'Daily Summary',time:'9:12 AM',body:'Crew is on site at Harbor Point. Framing starts after the 10 AM inspection.',icon:'↗'},{from:'Luis Ortega',channel:'WhatsApp',category:'Weekly Payroll',time:'8:44 AM',body:'Submitted 42 hours for the week, including 4 overtime hours at Westside.',icon:'◉'},{from:'Northline Supply',channel:'Email',category:'Order Scheduled',time:'Yesterday',body:'Steel studs delivery confirmed for Tuesday, 7:30–9:00 AM.',icon:'✉'},{from:'Sam Patel',channel:'Voicemail',category:'Daily Summary',time:'Yesterday',body:'Inspector requested updated drawings before Friday’s walkthrough.',icon:'◈'}]};
    const nav=['Today','Labor','Projects','Activity','Assistant'];
    const svg=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
    const buttonNav=name=>`<button type="button" data-nav="${name}" class="${state.view===name?'active':''}" aria-current="${state.view===name?'page':'false'}">${svg(name)}<span>${name}</span></button>`;
    const card=(body,classes='')=>`<section class="card ${classes}">${body}</section>`;
    const head=(title,extra='')=>`<div class="card-head"><h2>${title}</h2>${extra}</div>`;
    const item=(icon,title,description,tag='',amber=false)=>`<div class="item"><div class="item-icon ${amber?'amber':''}">${icon}</div><div class="item-body"><strong>${title}</strong><p>${description}</p></div>${tag?`<span class="tag ${amber?'':'green'}">${tag}</span>`:''}</div>`;
    function today(){return `<div class="grid"><div class="stack">${card(`<div class="card-pad briefing"><div class="eyebrow">✦ Your daily briefing</div><h2>Two decisions can keep today moving.</h2><p>Approve the Westside time sheet and confirm Harbor Point’s materials before the supplier cutoff. Jason has organized the details below.</p><div class="briefing-actions"><button class="primary" data-nav="Labor">Review payroll →</button><button class="secondary" data-nav="Activity">See messages</button></div></div>`)}<div class="metrics">${card('<span>Active projects</span><strong>04</strong><small>2 on track · 2 need review</small>','metric')}${card('<span>Hours this week</span><strong>186.5</strong><small>Across 6 crew members</small>','metric')}${card('<span>Needs attention</span><strong>02</strong><small>Payroll + delivery</small>','metric warn')}</div>${card(`<div class="card-pad">${head('Priority queue','<small>Updated from sample activity</small>')}<div class="list">${item('◷','Approve weekly payroll','6 crew members · 186.5 hours · estimated $6,842',state.approved?'Approved':'Review',true)}${item('▣','Confirm steel studs delivery','Northline Supply · Tuesday, 7:30–9:00 AM','Scheduled',false)}${item('↗','Send updated drawings','Harbor Point walkthrough · due Friday','Upcoming',true)}</div></div>`)}</div><div class="stack">${card(`<div class="card-pad">${head('Project pulse','<button class="link-button" data-nav="Projects">All projects →</button>')}<div class="list">${item('H','Harbor Point Renovation','Framing · inspection at 10 AM','At risk',true)}${item('W','Westside Office Fitout','Electrical rough-in · 72% complete','On track')}${item('N','North End Retail','Millwork · 41% complete','On track')}</div></div>`)}${card(`<div class="card-pad">${head('Latest activity','<button class="link-button" data-nav="Activity">View inbox →</button>')}<div class="list">${state.messages.slice(0,3).map(m=>item(m.icon,m.from,m.body,m.category,m.category==='Weekly Payroll')).join('')}</div></div>`)}</div></div>`}
    function labor(){return `<div class="grid"><div class="stack">${card(`<div class="card-pad">${head('Weekly payroll · Oct 12–18','<small>6 team members</small>')}<div class="metrics" style="margin-bottom:22px">${card('<span>Total hours</span><strong>186.5</strong><small>+12.5 vs. last week</small>','metric')}${card('<span>Estimated gross</span><strong>$6,842</strong><small>Before deductions</small>','metric')}${card(`<span>Approval</span><strong>${state.approved?'Done':'Pending'}</strong><small>${state.approved?'Saved in this demo':'Owner review required'}</small>`,'metric warn')}</div><div style="overflow:auto"><table class="table"><thead><tr><th>Crew member</th><th>Project</th><th>Hours</th><th>Est. pay</th></tr></thead><tbody><tr><td>Luis Ortega</td><td>Westside</td><td>42.0</td><td>$1,638</td></tr><tr><td>Maya Chen</td><td>Harbor Point</td><td>40.0</td><td>$1,440</td></tr><tr><td>Sam Patel</td><td>Harbor Point</td><td>36.5</td><td>$1,278</td></tr><tr><td>Riley Brooks</td><td>North End</td><td>32.0</td><td>$1,088</td></tr><tr><td>Jordan Lee</td><td>Westside</td><td>20.0</td><td>$720</td></tr><tr><td>Alex Rivera</td><td>South Park</td><td>16.0</td><td>$678</td></tr></tbody></table></div><div style="display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px"><span style="font-size:12px;color:var(--muted)">Includes 4 overtime hours for Luis.</span><button class="primary" id="approve-payroll" ${state.approved?'disabled':''}>${state.approved?'Payroll approved ✓':'Approve payroll'}</button></div></div>`)}</div><div class="stack">${card(`<div class="card-pad">${head('Jason’s review')}<div class="assistant-intro"><strong>One item to check</strong><p>Luis reported 4 overtime hours on the Westside fitout. His weekly total and estimate include the overtime premium.</p><button class="secondary" data-nav="Activity">View source message →</button></div></div>`)}</div></div>`}
    function projects(){let rows=[['Harbor Point Renovation','Framing + inspection','68%','At risk',68],['Westside Office Fitout','Electrical rough-in','72%','On track',72],['North End Retail','Millwork','41%','On track',41],['South Park Clinic','Site prep','23%','On track',23]];return `<div class="grid"><div class="stack">${card(`<div class="card-pad">${head('Active jobs','<small>4 projects</small>')}${rows.map(r=>`<div class="item" style="display:block"><div class="bar-row"><strong>${r[0]}</strong><span>${r[2]}</span></div><div style="font-size:12px;color:var(--muted)">${r[1]} · <span style="color:${r[3]==='At risk'?'var(--amber)':'var(--green)'}">${r[3]}</span></div><div class="progress"><i style="width:${r[4]}%"></i></div></div>`).join('')}</div>`)}</div><div class="stack">${card(`<div class="card-pad">${head('Upcoming milestones')}<div class="list">${item('▣','Steel studs delivery','Harbor Point · Tuesday, 7:30–9:00 AM','Scheduled')}${item('◷','Updated drawings due','Harbor Point · Friday','Action',true)}${item('✓','Electrical inspection','Westside · next Monday','Planned')}</div></div>`)}</div></div>`}
    function activity(){let cats=['All','Daily Summary','Weekly Payroll','Order Scheduled'];let filtered=state.filter==='All'?state.messages:state.messages.filter(m=>m.category===state.filter);return `<div class="grid"><div class="stack">${card(`<div class="card-pad">${head('Unified activity',`<small>${filtered.length} ${filtered.length===1?'message':'messages'}</small>`)}<div class="filter-row" role="group" aria-label="Filter messages">${cats.map(c=>`<button type="button" class="filter ${state.filter===c?'active':''}" data-filter="${c}" aria-pressed="${state.filter===c}">${c}</button>`).join('')}</div>${filtered.length?filtered.map(m=>`<article class="message"><span class="item-icon">${m.icon}</span><div><strong>${m.from}</strong><p>${m.body}</p><small>${m.channel} · ${m.category}</small></div><time>${m.time}</time></article>`).join(''):'<p class="empty">No messages in this category.</p>'}</div>`)}</div><div class="stack">${card(`<div class="card-pad">${head('How Jason sorts messages')}<div class="list">${item('↗','Daily Summary','Job site updates and decisions from the day.')}${item('◷','Weekly Payroll','Crew hours, overtime and owner review.', '',true)}${item('▣','Order Scheduled','Confirmed deliveries and timing.')}</div></div>`)}</div></div>`}
    function assistant(){return `<div class="grid"><div class="stack">${card(`<div class="card-pad">${head('Ask Jason','<small>Simulated assistant</small>')}<div class="assistant-intro"><strong>Good morning. I’m caught up.</strong><p>I can summarize the day, explain payroll, or show scheduled orders. My answers use the sample information in this demo.</p></div><div class="chat-log" id="chat-log" aria-live="polite"><div class="bubble">What would you like to know about today’s work?</div></div><form class="chat-form" id="chat-form"><input id="chat-input" type="text" maxlength="240" autocomplete="off" aria-label="Message Jason" placeholder="Ask about projects, payroll, orders…" required><button type="submit">Send</button></form><div class="prompt-row"><button type="button" data-prompt="What needs my attention?">What needs my attention?</button><button type="button" data-prompt="Summarize payroll">Summarize payroll</button><button type="button" data-prompt="What orders are scheduled?">Scheduled orders</button></div></div>`)}</div><div class="stack">${card(`<div class="card-pad">${head('Suggested next steps')}<div class="list">${item('1','Review payroll','Confirm 186.5 hours before the weekly run.','Pending',true)}${item('2','Check Harbor Point','Confirm the inspection and materials delivery.','Today',true)}${item('3','Send updated drawings','Prepare the set for Friday’s walkthrough.','Friday')}</div></div>`)}</div></div>`}
    const pages={Today:['Good morning, Jason.','Here’s what needs your attention across the business.',today],Labor:['Keep the crew moving.','Review hours, estimates and the weekly payroll decision.',labor],Projects:['Every job, in view.','Track progress, milestones and scheduled materials.',projects],Activity:['One place for every update.','Messages organized by what they mean for the work.',activity],Assistant:['Ask Jason.','A mock assistant grounded in this demo’s sample activity.',assistant]};
    function render(){document.getElementById('desktop-nav').innerHTML=nav.map(buttonNav).join('');document.getElementById('mobile-nav').innerHTML=nav.map(buttonNav).join('');let [title,subtitle,fn]=pages[state.view];document.getElementById('crumb').textContent=state.view;document.getElementById('page-title').textContent=title;document.getElementById('page-subtitle').textContent=subtitle;document.getElementById('view').innerHTML=fn();document.title=`${state.view} — JasonAI demo`}
    function toast(msg){let el=document.getElementById('notice');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200)}
    function reply(q){let s=q.toLowerCase();if(/pay|hour|labor|overtime|crew/.test(s))return 'This week, 6 crew members logged 186.5 hours. Estimated gross payroll is $6,842. Luis has 4 overtime hours. Payroll is '+(state.approved?'approved in this demo.':'waiting for your review.');if(/order|deliver|material|steel/.test(s))return 'Northline Supply confirmed steel studs for Harbor Point on Tuesday between 7:30 and 9:00 AM. The order is categorized as Order Scheduled.';if(/project|job|harbor|westside/.test(s))return 'Four projects are active. Harbor Point needs attention: framing starts after the 10 AM inspection, and updated drawings are due Friday. Westside is 72% complete.';if(/message|activity|summary|today|attention|priority/.test(s))return 'Two priorities: review weekly payroll and confirm Harbor Point materials. Maya reported the crew on site; the inspection is at 10 AM. Updated drawings are due Friday.';return 'I can help with today’s priorities, payroll, active projects, and scheduled orders using the sample data in this demo.'}
    document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){state.view=n.dataset.nav;render();window.scrollTo({top:0,behavior:'smooth'});return}let f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return}if(e.target.closest('#approve-payroll')){state.approved=true;render();toast('Weekly payroll approved in this demo.');return}let p=e.target.closest('[data-prompt]');if(p){state.view='Assistant';render();document.getElementById('chat-input').value=p.dataset.prompt;document.getElementById('chat-form').requestSubmit()}});
    document.addEventListener('submit',e=>{if(e.target.id!=='chat-form')return;e.preventDefault();let input=document.getElementById('chat-input'),q=input.value.trim();if(!q)return;let log=document.getElementById('chat-log');for(let [message,cls] of [[q,'user'],[reply(q),'']]){let div=document.createElement('div');div.className='bubble '+cls;div.textContent=message;log.append(div)}input.value='';log.scrollTop=log.scrollHeight});
    document.getElementById('date-chip').textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'}).format(new Date());render();
  </script>
</body>
</html>
