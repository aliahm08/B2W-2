<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11150f">
<meta name="description" content="JasonAI is an executive secretary for general contractor owners.">
<title>JasonAI · by B2W</title>
<style>
:root{--paper:#f2f1ed;--ink:#11110f;--muted:#6e6a65;--rule:rgba(17,17,15,.15);--size:15px;--line:1.62;--max:760px;--shell:1120px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-size:var(--size);line-height:var(--line)}
body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background-color .26s,color .26s}
body,body *:not(svg):not(svg *):not(path):not(circle){font-size:var(--size)!important;line-height:var(--line)}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0;font-weight:400;letter-spacing:normal}
h1,h2{font-weight:700}
body.theme-dark{--paper:#11150f;--ink:#f2f1ed;--muted:#b4bcb2;--rule:rgba(242,241,237,.2)}
body.theme-gray{--paper:#dedfdf;--ink:#171b1c;--muted:#565d5d;--rule:rgba(17,17,15,.18)}
.site-shell{min-height:100dvh;display:flex;flex-direction:column}
.site-header{position:relative;z-index:30;padding:30px 0 0;background:var(--paper)}
.header-inner{width:min(92vw,var(--shell));margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;min-height:44px}
.brand{justify-self:start;font-weight:750}
.desktop-nav{justify-self:center;display:flex;align-items:center;gap:24px}
.desktop-nav a{white-space:nowrap;color:var(--muted)}
.desktop-nav a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.header-contact{justify-self:end;border:1px solid var(--rule);border-radius:999px;padding:7px 15px}
.menu-toggle{display:none}
.mobile-menu{display:none}
main{flex:1}
.page{width:min(88vw,var(--max));margin:0 auto;padding:clamp(70px,10vh,140px) 0 90px}
.page-label{font-weight:700;letter-spacing:.10em;text-transform:uppercase;margin-bottom:58px}
.hero-statement{max-width:690px}
.hero-statement strong{font-weight:750}
.hero-statement p+p{margin-top:12px}
.page-home .hero-statement{margin-bottom:clamp(90px,22vh,240px)}
.section-link{display:flex;align-items:center;justify-content:space-between;gap:22px;border-bottom:1px solid var(--rule);padding:20px 0}
.section-link:first-of-type{border-top:1px solid var(--rule)}
.section-link:focus-visible,.section-link:hover{color:var(--muted);outline-offset:5px}
.page-home .secondary-statement{margin:65px 0 80px;max-width:630px}
.page-home .bottom-link{margin-top:95px}
.section-rule{border:0;border-top:1px solid var(--rule);margin:38px 0}
.page h2{margin-bottom:24px}
.accordion{border-top:1px solid var(--rule)}
.accordion:last-of-type{border-bottom:1px solid var(--rule)}
.accordion-trigger{display:grid;grid-template-columns:24px 1fr 24px;gap:20px;align-items:center;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;padding:22px 0;font-weight:700}
.accordion-trigger .glyph{font-weight:400;color:var(--muted)}
.accordion-trigger .sign{justify-self:end;font-weight:400}
.accordion-body{display:none;padding:28px 0 42px 44px;max-width:690px}
.accordion[data-open="true"] .accordion-body{display:block}
.accordion-body p+p{margin-top:20px}
.accordion-body strong{font-weight:700}
.symbol{display:grid;place-content:center;border:1px solid currentColor;width:50px;height:50px;border-radius:50%;margin:0 auto 40px}
.grid-notes{border-top:1px solid var(--rule);margin:60px 0}
.grid-notes article{display:grid;grid-template-columns:minmax(90px,.4fr) 1fr;gap:24px;border-bottom:1px solid var(--rule);padding:23px 0}
.grid-notes b{font-weight:700}
.flow-box{margin-top:64px;border:1px solid var(--rule);padding:25px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between}
.flow-copy{max-width:540px}
.flow-controls{display:flex;gap:12px;margin-top:60px}
.flow-controls button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:9px 17px;cursor:pointer;min-height:42px}
.flow-controls button:last-child{background:var(--ink);color:var(--paper)}
.flow-controls button:disabled{opacity:.3;cursor:not-allowed}
.link-stack{margin-top:60px}
.site-footer{width:min(92vw,var(--shell));margin:50px auto 0;padding:28px 0;border-top:1px solid var(--rule);color:var(--muted)}
.site-footer a{text-decoration:underline;text-underline-offset:5px}
@media(max-width:780px){
.site-header{position:relative;padding:0;background:var(--paper)}
.header-inner{width:calc(100% - 32px);grid-template-columns:1fr auto;min-height:70px;gap:14px}
.desktop-nav,.header-contact{display:none}
.menu-toggle{display:flex;justify-self:end;justify-content:center;align-items:center;width:50px;height:42px;border:1px solid var(--rule);border-radius:999px;background:transparent;cursor:pointer;z-index:33}
.menu-toggle span{display:block}
.mobile-menu{display:none}
body.menu-open{overflow:hidden}
body.menu-open .mobile-menu{position:fixed;inset:70px 0 0;z-index:32;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);padding:26px 24px 45px;overflow-y:auto}
.mobile-menu a{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:17px 0;min-height:55px}
.mobile-menu .mobile-contact{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:14px 18px;margin-top:30px;font-weight:700}
.mobile-menu .parent-site-link{border:0;padding:20px 18px;min-height:60px;opacity:.78}
.page{width:calc(100% - 32px);padding:72px 0 65px}
.page-label{margin-bottom:48px}
.page-home .hero-statement{margin-bottom:105px}
.page-home .secondary-statement{margin:80px 0}
.accordion-body{padding:22px 0 34px 24px}
.grid-notes article{grid-template-columns:1fr;gap:5px}
.site-footer{width:calc(100% - 32px)}
}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style></head><body class="theme-dark"><div class="site-shell">
<header class="site-header"><div class="header-inner">
<a class="brand" href="/jasonai/" aria-label="JasonAI home">JasonAI</a>
<nav class="desktop-nav" aria-label="JasonAI pages">
<a href="/jasonai/">Home</a><a href="/jasonai/capabilities/">Capabilities</a><a href="/jasonai/how-it-works/">How It Works</a><a href="/jasonai/scenarios/">Scenarios</a>
</nav>
<a class="header-contact" href="mailto:hello@b2w-ai.com?subject=JasonAI%20demo">Contact</a>
<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open navigation"><span>Menu +</span></button>
</div><nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation">
<a href="/jasonai/">Home <span>↗</span></a>
<a href="/jasonai/capabilities/">Capabilities <span>↗</span></a>
<a href="/jasonai/how-it-works/">How It Works <span>↗</span></a>
<a href="/jasonai/scenarios/">Scenarios <span>↗</span></a>
<a href="/jasonai/demo/">Request a demo <span>↗</span></a>
<a class="mobile-contact" href="mailto:hello@b2w-ai.com?subject=JasonAI%20inquiry">Contact <span>→</span></a>
<a class="parent-site-link" href="/">B2W <span>↗</span></a>
</nav></header>
<main id="main"></main>
<footer class="site-footer">JasonAI · by <a href="/">B2W ↗</a></footer>
</div><script>
(function(){
'use strict';
const main=document.getElementById('main');
const routes=['/jasonai','/jasonai/capabilities','/jasonai/how-it-works','/jasonai/scenarios','/jasonai/demo'];
const route=window.location.pathname.replace(/\\/$/,'') || '/jasonai';
const current=routes.includes(route)?route:'/jasonai';
const tone={'/jasonai':'dark','/jasonai/capabilities':'gray','/jasonai/how-it-works':'light','/jasonai/scenarios':'dark','/jasonai/demo':'light'}[current];
document.body.className='theme-'+tone;
document.querySelector('meta[name="theme-color"]').setAttribute('content',tone==='dark'?'#11150f':tone==='gray'?'#dedfdf':'#f2f1ed');
document.querySelectorAll('.desktop-nav a').forEach(a=>{if(a.pathname.replace(/\\/$/,'')===current)a.setAttribute('aria-current','page')});
function page(label,title,content){document.title=title+' · JasonAI · B2W';main.innerHTML='<div class="page"><p class="page-label">'+label+'</p>'+content+'</div>'}
const links='<div class="link-stack"><a class="section-link" href="/jasonai/capabilities/">Capabilities <span>↗</span></a><a class="section-link" href="/jasonai/how-it-works/">How It Works <span>↗</span></a><a class="section-link" href="/jasonai/scenarios/">Scenarios <span>↗</span></a><a class="section-link" href="/jasonai/demo/">Request a demo <span>↗</span></a></div>';
const accordion=(key,icon,title,lead,detail,open)=>'<section class="accordion" data-open="'+String(open)+'"><button class="accordion-trigger" aria-expanded="'+String(open)+'" type="button"><span class="glyph">'+icon+'</span><span>'+title+'</span><span class="sign">'+(open?'×':'+')+'</span></button><div class="accordion-body"><div class="symbol" aria-hidden="true">'+icon+'</div><p><strong>'+lead+'</strong></p><p>'+detail+'</p></div></section>';
if(current==='/jasonai'){
 page('JasonAI / Home','Home','<section class="page-home"><div class="hero-statement"><h1>JasonAI remembers the details from the project conversations you choose to share.</h1></div><a class="section-link" href="/jasonai/capabilities/">Capabilities <span>↗</span></a><p class="secondary-statement"><strong>An executive secretary for the owner,</strong> not a replacement for your project manager.</p><a class="section-link" href="/jasonai/how-it-works/">How It Works <span>↗</span></a><div class="bottom-link"><p><strong>Try JasonAI on a real workflow</strong> and see what it can organize, draft, and prepare for your approval.</p><a class="section-link" href="/jasonai/scenarios/">Scenarios <span>↗</span></a></div>'+links+'</section>');
}else if(current==='/jasonai/capabilities'){
 page('Capabilities','Capabilities','<h1>Capabilities</h1><hr class="section-rule">'+accordion('agent','⊕','Agent','An executive secretary in your existing conversations.','Ask JasonAI questions, share voice notes, request summaries, prepare responses, and propose updates. The agent reads only approved context and seeks owner approval before consequential actions.',true)+accordion('platform','▤','Platform','A connected view of the operation.','Use authorized project conversations to keep labor, project and delivery information organized. Review proposed changes with their sources before they update the business.',false)+links);
}else if(current==='/jasonai/how-it-works'){
 page('How It Works','How It Works','<h1>JasonAI works where your team already communicates.</h1><div class="grid-notes"><article><b>01 / Choose</b><p>Share only the conversations, messages, notes and files that JasonAI is permitted to use.</p></article><article><b>02 / Remember</b><p>Connect the selected details to projects, labor and deliveries so context carries forward.</p></article><article><b>03 / Prepare</b><p>Surface open commitments, draft replies and suggest changes to the existing tools.</p></article><article><b>04 / Approve</b><p>The owner can review the source before consequential changes are made.</p></article></div>'+links);
}else if(current==='/jasonai/scenarios'){
 page('Scenarios','Scenarios','<h1>Try JasonAI on a real workflow and see what it can organize, draft, and prepare for your approval.</h1><div class="grid-notes"><article><b>Project update</b><p>Turn a crew message into a reviewable project update.</p></article><article><b>Labor</b><p>Find who worked, where and what needs to be confirmed for payment.</p></article><article><b>Delivery</b><p>Track changed dates, missing materials and owner decisions.</p></article><article><b>Follow-up</b><p>Prepare a response while preserving the conversation context.</p></article></div><a class="section-link" href="/jasonai/demo/">Request a demo <span>↗</span></a>'+links);
}else{
 page('Demo','Interactive demo','<h1>From one conversation to a decision you can review.</h1><div class="flow-box" id="flow"><div><p class="page-label" id="flow-number">01 / Source</p><p class="flow-copy" id="flow-text"></p></div><div class="flow-controls"><button id="flow-back" type="button">Previous</button><button id="flow-next" type="button">Next →</button></div></div><p style="margin-top:20px">Illustrative only. No project data or systems are connected.</p>'+links);
 const frames=[['01 / Source','A crew message says framing is complete and three workers stayed late.'],['02 / Memory','JasonAI connects the update to the project and labor records.'],['03 / Proposal','JasonAI prepares a project update and asks for confirmation of hours.'],['04 / Approval','The owner reviews the source and approves or edits the proposed change.']];
 let n=0;const render=()=>{document.getElementById('flow-number').textContent=frames[n][0];document.getElementById('flow-text').textContent=frames[n][1];document.getElementById('flow-back').disabled=n===0;document.getElementById('flow-next').textContent=n===3?'Restart ↻':'Next →'};
 document.getElementById('flow-back').addEventListener('click',()=>{n=Math.max(0,n-1);render()});
 document.getElementById('flow-next').addEventListener('click',()=>{n=(n+1)%frames.length;render()});render();
}
main.addEventListener('click',e=>{const b=e.target.closest('.accordion-trigger');if(!b)return;const section=b.closest('.accordion');const open=section.getAttribute('data-open')!=='true';section.setAttribute('data-open',String(open));b.setAttribute('aria-expanded',String(open));b.querySelector('.sign').textContent=open?'×':'+'});
const toggle=document.querySelector('.menu-toggle'),menu=document.querySelector('#mobile-menu');
function setMenu(open){document.body.classList.toggle('menu-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');toggle.querySelector('span').textContent=open?'Close ×':'Menu +'}
toggle.addEventListener('click',()=>setMenu(toggle.getAttribute('aria-expanded')!=='true'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
window.addEventListener('resize',()=>{if(window.innerWidth>780)setMenu(false)});
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));
})();
</script></body></html>
